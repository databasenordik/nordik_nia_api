syntax = "proto3";
package nordik.nia.v1;
option go_package = "nordik-drive-api/internal/nia/pb;niapb";

service Assistant {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Reads text aloud. A long answer exceeds a Go client's default 4 MiB receive limit; raise it for this call.
  rpc Speak(SpeakRequest) returns (SpeakResponse);
  // Returns what a recording says, without answering it. Audio may be up to 20 MiB.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
}

message QueryRequest {
  string question = 1;
  int64 selected_file_id = 2;
  string conversation_id = 3;
  string model = 4;
  repeated string communities = 5;
  int64 user_id = 6;
}

message QueryResponse {
  string status = 1;
  string answer = 2;
  string conversation_id = 3;
  int64 selected_file_id = 4;
  string error_code = 5;
  string detail = 6;
  bytes result_json = 7;
  string exchange_id = 8;
}

message HealthRequest {}
message HealthResponse { string status = 1; }

message HistoryRequest {
  int64 user_id = 1;
  int64 selected_file_id = 2;
  string conversation_id = 3;
  int32 limit = 4;
}

message HistoryResponse { bytes result_json = 1; }

message SpeakRequest {
  string text = 1;
  int64 user_id = 2;
}
message SpeakResponse {
  bytes audio = 1;
  string mime_type = 2;
}

message TranscribeRequest {
  bytes audio = 1;
  string mime_type = 2;
  int64 user_id = 3;
}
message TranscribeResponse { string text = 1; }
