[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nia-assistant"
version = "0.1.0"
description = "Standalone research-data assistant core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
xai = [
    "xai-sdk>=1.0",
    "websockets>=14",
]
voice = [
    "livekit-agents>=1.2",
    "livekit-plugins-silero>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "planner_ai: exercise the AI planner path (application default is AI; tests stay on legacy unless marked)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/security/deps.py" = ["B008"]
