name: CI (Python)

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install pytest==8.4.2 pytest-asyncio==0.26.0
          python -m pip install --no-deps .
      - name: Tests
        run: python -m pytest tests -q
      - name: Build and smoke test the deployment image
        run: |
          docker build -t nia-ci .
          docker run -d --name nia-ci -p 8080:8080 -e PORT=8080 -e APP_ENV=development -e ASSISTANT_DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused nia-ci
          trap 'docker logs nia-ci; docker rm -f nia-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health > /tmp/health.json; then
              python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
              exit 0
            fi
            sleep 2
          done
          exit 1
