name: CI (Python)

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARTIFACT_REGISTRY_HOST: us-west1-docker.pkg.dev
  PYTHON_BASE_IMAGE: us-west1-docker.pkg.dev/planar-ray-472112-e8/docker-hub-cache/python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install pytest==8.4.2 pytest-asyncio==0.26.0
          python -m pip install --no-deps .
      - name: Tests
        run: python -m pytest tests -q
      - id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker authentication for Artifact Registry
        run: gcloud auth configure-docker "$ARTIFACT_REGISTRY_HOST" --quiet
      - name: Pull cached Python base image with retry
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$PYTHON_BASE_IMAGE"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Build and smoke test the deployment image
        run: |
          docker build --pull=false --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" -t nia-ci .
          docker run -d --name nia-ci -p 8080:8080 -e PORT=8080 -e APP_ENV=development -e ASSISTANT_DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused nia-ci
          trap 'docker logs nia-ci; docker rm -f nia-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health > /tmp/health.json; then
              python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Smoke test the gRPC deployment mode
        run: |
          docker run -d --name nia-grpc-ci -e PORT=8080 -e APP_ENV=development -e NIA_TRANSPORT=grpc -e NIA_GRPC_PRINCIPAL_ID=ci-fixture -e PLANNER_MODE=legacy -e REASONING_PROVIDER=fake -e ASSISTANT_DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused nia-ci
          trap 'docker logs nia-grpc-ci; docker rm -f nia-grpc-ci' EXIT
          for attempt in $(seq 1 10); do
            if docker exec nia-grpc-ci python -m app.grpc_api.probe --target 127.0.0.1:8080 --plaintext --question 'How many records are in this list?'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
