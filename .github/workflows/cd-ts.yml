name: CD (TypeScript) Build + Push + Deploy research service

# Deploys only the separate nordik-nia-research service, and only when a release tag is pushed.
# The production nordik-nia-api service and cd-python.yml are never touched from here.
on:
  push:
    tags: ['nia-research-v*']

concurrency:
  group: nia-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-ts.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: planar-ray-472112-e8
      REGION: us-west1
      CLOUD_RUN_SERVICE: nordik-nia-research
      # Same Artifact Registry repository as the API, under its own image name.
      AR_REPO: nordik-nia-api
      IMAGE_NAME: nordik-nia-research
      REGISTRY: us-west1-docker.pkg.dev
    steps:
      - name: Refuse to target the production API
        run: test "$CLOUD_RUN_SERVICE" != nordik-nia-api && test "$IMAGE_NAME" != nordik-nia-api
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Require the bootstrapped service
        run: |
          # The service, its secrets and its database connection are created once by hand (DEPLOY.md).
          # Creating it here would start a revision with no configuration.
          if ! gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)'; then
            echo "::error::$CLOUD_RUN_SERVICE does not exist. Bootstrap it as described in DEPLOY.md."
            exit 1
          fi
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Compute immutable image tag
        run: echo "IMAGE_URI=$REGISTRY/$PROJECT_ID/$AR_REPO/$IMAGE_NAME:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Build and push
        run: |
          docker build --no-cache -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
      - name: Deploy
        run: |
          # Only the image and resources change; environment, secrets, service account and database
          # connection stay as bootstrapped. One instance, because chats are kept on the instance.
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_URI" \
            --min-instances 1 --max-instances 1 --cpu 1 --memory 2Gi --port 8080 \
            --timeout 900 --no-use-http2 \
            --startup-probe=httpGet.path=/health,httpGet.port=8080,timeoutSeconds=1,periodSeconds=10,failureThreshold=24 \
            --quiet
      - name: Verify Cloud Run revision readiness
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          python -c 'import json; s=json.load(open("/tmp/service.json"))["status"]; assert any(c["type"] == "Ready" and c["status"] == "True" for c in s["conditions"]); assert s["latestReadyRevisionName"] == s["latestCreatedRevisionName"]'
      - name: Check public health endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$SERVICE_URL/health" > /tmp/health.json
          python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
