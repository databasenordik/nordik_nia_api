name: CI (TypeScript)

on:
  push:
    branches: [nia-ts-backend]
  pull_request:
    branches: [nia-ts-backend]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nia-research:ci .
      - name: Modules resolve inside the image
        run: docker run --rm nia-research:ci bun -e 'await import("./backend/src/host.ts"); await import("./backend/src/http-session.ts")'
      - name: Unsafe production configuration stops the process
        run: |
          # Must fail on configuration, before any database connection is attempted.
          if output=$(docker run --rm -e APP_ENV=production nia-research:ci 2>&1); then
            echo 'The API started without production credentials'; exit 1
          fi
          echo "$output" | grep -q 'unsafe configuration'
