name: CD (TypeScript) Build + Push + Deploy production

# Every push to main deploys the production nordik-nia-api service, as cd-python.yml did for the
# Python API. Environment, secrets, service account and database connection stay as configured on the
# service; only the image and resources change.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nia-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-ts.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: planar-ray-472112-e8
      REGION: us-west1
      CLOUD_RUN_SERVICE: nordik-nia-api
      AR_REPO: nordik-nia-api
      IMAGE_NAME: nordik-nia-api
      REGISTRY: us-west1-docker.pkg.dev
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read configured NIA transport
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/nia-service.json
          TRANSPORT=$(python -c 'import json; s=json.load(open("/tmp/nia-service.json")); e=s["spec"]["template"]["spec"]["containers"][0].get("env", []); print(next((v.get("value", "http") for v in e if v["name"] == "NIA_TRANSPORT"), "http"))')
          case "$TRANSPORT" in http|grpc) ;; *) echo 'Invalid NIA_TRANSPORT'; exit 1 ;; esac
          echo "NIA_TRANSPORT=$TRANSPORT" >> "$GITHUB_ENV"
          # The revision serving now, so a bad release can be rolled back by name.
          PREVIOUS=$(python -c 'import json; print(json.load(open("/tmp/nia-service.json"))["status"].get("latestReadyRevisionName", ""))')
          echo "PREVIOUS_REVISION=$PREVIOUS" >> "$GITHUB_ENV"
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Compute immutable image tag
        run: echo "IMAGE_URI=$REGISTRY/$PROJECT_ID/$AR_REPO/$IMAGE_NAME:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Build and push
        run: |
          docker build --no-cache -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
      - name: Deploy
        run: |
          # The port opens only once the database checks and the engine are up, so the startup probe
          # gates traffic; a revision that fails it never serves and the previous one keeps serving.
          # Follow-ups that reach another instance rebuild their context from the history in Postgres.
          TRANSPORT_FLAGS=()
          if [ "$NIA_TRANSPORT" = grpc ]; then
            TRANSPORT_FLAGS+=(--use-http2 --startup-probe=tcpSocket.port=8080,timeoutSeconds=1,periodSeconds=10,failureThreshold=24)
          else
            TRANSPORT_FLAGS+=(--no-use-http2 --startup-probe=httpGet.path=/health,httpGet.port=8080,timeoutSeconds=1,periodSeconds=10,failureThreshold=24)
          fi
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE_URI" \
            --ingress all --allow-unauthenticated \
            --min-instances 1 --max-instances 3 --cpu 1 --memory 2Gi --port 8080 \
            --timeout 900 "${TRANSPORT_FLAGS[@]}" --quiet
      - name: Verify Cloud Run revision readiness
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json > /tmp/service.json
          python -c 'import json; s=json.load(open("/tmp/service.json"))["status"]; assert any(c["type"] == "Ready" and c["status"] == "True" for c in s["conditions"]); assert s["latestReadyRevisionName"] == s["latestCreatedRevisionName"]'
      - name: Check public health endpoint
        if: env.NIA_TRANSPORT == 'http'
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$SERVICE_URL/health" > /tmp/health.json
          python -c 'import json; assert json.load(open("/tmp/health.json"))["status"] == "ok"'
      - name: Check public gRPC health endpoint
        if: env.NIA_TRANSPORT == 'grpc'
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          docker run --rm "$IMAGE_URI" bun run backend/src/probe.ts --target "${SERVICE_URL#https://}:443"
      - name: How to roll back
        if: failure() && env.PREVIOUS_REVISION != ''
        run: |
          echo "::error::The release failed. To send all traffic back to the revision that served before it:"
          echo "gcloud run services update-traffic $CLOUD_RUN_SERVICE --project $PROJECT_ID --region $REGION --to-revisions=$PREVIOUS_REVISION=100"
